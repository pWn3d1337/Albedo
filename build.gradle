// Albedo (Minecraft 1.12.2 Forge) built with RetroFuturaGradle.
// See README.md for the commands and JDK requirements.
plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

// CI dev builds pass -Pdev_build=<run number>: version <mod_version>-dev.<n>
if (project.hasProperty('dev_build')) {
    project.ext.mod_version = "${project.mod_version}-dev.${project.dev_build}"
}

version = "${project.mc_version}-${project.mod_version}"
group = 'elucent.albedo'

base {
    archivesName = 'albedo'
}

java {
    toolchain {
        // Minecraft 1.12.2 runs on Java 8 only. Gradle uses an installed JDK 8 or downloads one (Foojay).
        languageVersion = JavaLanguageVersion.of(8)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forge: RFG pins 1.12.2 to 14.23.5.2847, the last build published with a userdev jar.
// The mod itself runs on any 14.23.5.x Forge.

minecraft {
    mcVersion = project.mc_version
    mcpMappingChannel = project.mapping_channel
    mcpMappingVersion = project.mapping_version
    username = 'Developer'

    // Albedo is a coremod (ASM hooks into the renderer); in dev it must be named explicitly
    extraRunJvmArguments.add('-Dfml.coreMods.load=elucent.albedo.asm.FMLPlugin')
    // Test lights on torches, lit redstone lamps, sea lanterns, glowstone and a held blaze rod (see DebugLights)
    extraRunJvmArguments.add('-Dalbedo.debugLights=true')
    // ./gradlew runClient -PalbedoAutoTest: unattended smoke test with screenshots (see AutoTest)
    if (project.hasProperty('albedoAutoTest')) {
        extraRunJvmArguments.add('-Dalbedo.autoTest=true')
    }
}

// Dev-only tools (src/devtools): an MCP bridge mod for the dev client, compatible with the mcpfabric MCP server.
// They are on the runClient classpath only and never part of the Albedo jar.
sourceSets {
    devtools {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    runtimeOnly sourceSets.devtools.output
}

processResources {
    inputs.property 'version', project.mod_version
    inputs.property 'mcversion', project.mc_version

    filesMatching('mcmod.info') {
        expand 'version': project.mod_version, 'mcversion': project.mc_version
    }
}

jar {
    manifest {
        attributes(
                'FMLCorePlugin': 'elucent.albedo.asm.FMLPlugin',
                'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}
