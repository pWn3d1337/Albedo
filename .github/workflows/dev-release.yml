name: Dev build

# Every push to master: builds and replaces the rolling "dev" GitHub pre-release with the new jar
# (mod version <mod_version>-dev.<run number>). Only the latest dev build is kept.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# a newer push supersedes a dev build still running
concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  dev-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Gradle runs on Java 21; the mod is compiled with the Java 8 toolchain (Minecraft 1.12.2)
      - name: Setup JDK 8 and 21
        uses: actions/setup-java@v6
        with:
          java-version: |
            8
            21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build -Pdev_build=${{ github.run_number }}

      - name: Replace the dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # RFG also writes a deobfuscated *-dev.jar for development; publish only the release jar
          jar=$(ls build/libs/*.jar | grep -v -- '-dev\.jar$')
          {
            echo "Automatic test build of \`${GITHUB_SHA::7}\` (run ${{ github.run_number }}) for Minecraft 1.12.2. Replaced on every push to master; expect bugs."
            echo
            echo "### Changes since the previous dev build"
            if git rev-parse -q --verify refs/tags/dev >/dev/null; then
              git log --no-merges --format='- %s' -n 50 dev..HEAD
            else
              # first dev build (no "dev" tag yet): only this commit, not the inherited upstream history
              git log --no-merges --format='- %s' -n 1
            fi
          } > notes.md
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "$jar" --prerelease --target "$GITHUB_SHA" \
            --title "Dev build ${{ github.run_number }} ($(basename "$jar" .jar))" --notes-file notes.md
