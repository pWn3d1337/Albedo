name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Gradle runs on Java 21; the mod is compiled with the Java 8 toolchain (Minecraft 1.12.2)
      - name: Setup JDK 8 and 21
        uses: actions/setup-java@v6
        with:
          java-version: |
            8
            21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build compileDevtoolsJava

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: albedo-jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
